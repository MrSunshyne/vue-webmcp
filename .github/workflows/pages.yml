name: Deploy playgrounds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: BASE_PATH=/vue-webmcp/vite/ pnpm --filter playground-vite build
      - run: NUXT_APP_BASE_URL=/vue-webmcp/nuxt/ pnpm --filter playground-nuxt generate
      - name: Assemble site
        run: |
          mkdir -p site
          cp playgrounds/index.html site/index.html
          cp -r playgrounds/vite/dist site/vite
          cp -r playgrounds/nuxt/.output/public site/nuxt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
